name: Validate portable dotfiles
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-public.py
      - name: Check shell syntax
        run: |
          bash -n apply.sh install.sh setup-global-gitignore.sh macos/apply.sh
          find karabiner sketchybar -type f -name '*.sh' -exec bash -n {} \;
      - name: Check macOS command wrapper
        run: python3 scripts/test-macos-wrapper.py
      - name: Validate bounded wallpaper extraction
        run: python3 scripts/test-wallpaper-accent.py
